
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Bags Store</title>
    <style>
        /* Base Styles */
        body { font-family: 'Georgia', serif; margin: 0; padding: 0; background-color: #fcfbfa; color: #333; }
        
        /* Premium Navbar */
        nav { background-color: #111; padding: 20px; text-align: center; border-bottom: 1px solid #2a2415; }
        nav .logo { font-size: 24px; color: #dfb76c; letter-spacing: 6px; font-weight: 300; text-transform: uppercase; }

        /* Luxury Hero Banner Element */
        .hero-banner {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            height: 450px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }
        .hero-banner h2 { 
            font-size: 2.5rem; 
            margin: 0 0 15px 0; 
            letter-spacing: 5px; 
            font-weight: 300; 
            color: #dfb76c;
            text-transform: uppercase;
        }
        .hero-banner p { 
            font-size: 1.1rem; 
            margin: 0 0 30px 0; 
            letter-spacing: 2px; 
            max-width: 600px;
            font-style: italic;
            color: #e5dfd3;
        }
        .hero-banner .shop-btn { 
            background-color: #dfb76c; 
            color: #111; 
            padding: 12px 35px; 
            text-decoration: none; 
            font-size: 0.9rem;
            letter-spacing: 2px; 
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s ease;
            font-family: sans-serif;
        }
        .hero-banner .shop-btn:hover { 
            background-color: #fff; 
            color: #111;
        }

        /* Products Grid */
        .section-title { text-align: center; margin: 50px 0 20px 0; letter-spacing: 3px; font-weight: 400; text-transform: uppercase; }
        .container { max-width: 1100px; margin: 0 auto 60px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .product-card { background: white; padding: 25px; text-align: center; border: 1px solid #e5dfd3; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .product-card img { max-width: 100%; height: auto; margin-bottom: 20px; max-height: 250px; object-fit: cover; }
        .product-card h3 { margin: 10px 0; font-weight: 400; letter-spacing: 1px; }
        .price { color: #b89244; font-size: 1.3rem; font-weight: bold; margin-bottom: 20px; }
        .btn { background-color: #111; color: white; padding: 12px 25px; text-decoration: none; display: inline-block; letter-spacing: 1px; font-family: sans-serif; font-size: 0.85rem; text-transform: uppercase; }
        .btn:hover { background-color: #dfb76c; color: #111; }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav>
        <div class="logo">Luxury Bags</div>
    </nav>

    <!-- Luxury Hero Banner Section -->
    <div class="hero-banner">
        <h2>Define Your Elegance</h2>
        <p>Discover our exclusive handcrafted collection of premium luxury bags</p>
        <a href="#collection" class="shop-btn">Explore Collection</a>
    </div>

    <!-- Product Grid Section -->
    <h2 class="section-title" id="collection">New Arrivals</h2>
    <div class="container">
        <!-- Product 1 -->
        <div class="product-card">
            <img src="https://unsplash.com" alt="Luxury Bag">
            <h3>Classic Leather Handbag</h3>
            <div class="price">$250</div>
            <a href="#" class="btn">Order via WhatsApp</a>
        </div>
        <!-- Product 2 -->
        <div class="product-card">
            <img src="https://unsplash.com" alt="Luxury Bag">
            <h3>Premium Shoulder Bag</h3>
            <div class="price">$320</div>
            <a href="#" class="btn">Order via WhatsApp</a>
        </div>
    </div>

</body>
</html>
